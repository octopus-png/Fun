```html
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ছাগল ও সিংহ ফুলস্ক্রিন ইমেজ ভিউয়ার</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Hind Siliguri', sans-serif;
        }

        /* 100% viewport coverage animation */
        @keyframes zoomIn {
            from {
                transform: scale(0.95);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .animate-zoom {
            animation: zoomIn 0.25s ease-out forwards;
        }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col justify-between items-center select-none overflow-x-hidden">

    <header class="w-full text-center py-6 px-4 bg-slate-900/80 backdrop-blur-md border-b border-slate-800 shadow-xl">
        <h1 class="text-3xl sm:text-5xl font-extrabold text-amber-400 tracking-wide">
            ইমোজিতে ক্লিক করুন
        </h1>
        <p class="text-slate-300 text-base sm:text-lg mt-2">
            ছবি পুরো স্ক্রিন জুড়ে বড় করে দেখতে নিচে পছন্দমত ইমোজিতে চাপ দিন
        </p>
    </header>

    <main class="flex-1 flex items-center justify-center w-full py-10">
        <div class="flex flex-col sm:flex-row items-center justify-center gap-10 sm:gap-20 px-6 max-w-5xl w-full">
            
            <!-- Lion Card -->
            <button onclick="openUltraFullscreen('lion')" 
                    class="group relative flex flex-col items-center justify-center w-full sm:w-1/2 p-8 sm:p-12 bg-slate-900/90 hover:bg-slate-800 border-2 border-amber-500/40 hover:border-amber-400 rounded-3xl transition-all duration-300 transform hover:-translate-y-3 hover:shadow-[0_0_40px_rgba(245,158,11,0.4)] active:scale-95 cursor-pointer">
                <span class="text-9xl sm:text-[160px] leading-none transition-transform duration-300 group-hover:scale-110 drop-shadow-2xl">
                    🦁
                </span>
                <span class="mt-6 px-8 py-3 bg-amber-500 text-slate-950 font-bold text-xl sm:text-2xl rounded-full shadow-lg group-hover:bg-amber-400 transition-colors duration-300">
                    সিংহ (Lion)
                </span>
            </button>

            <!-- Goat Card -->
            <button onclick="openUltraFullscreen('goat')" 
                    class="group relative flex flex-col items-center justify-center w-full sm:w-1/2 p-8 sm:p-12 bg-slate-900/90 hover:bg-slate-800 border-2 border-emerald-500/40 hover:border-emerald-400 rounded-3xl transition-all duration-300 transform hover:-translate-y-3 hover:shadow-[0_0_40px_rgba(16,185,129,0.4)] active:scale-95 cursor-pointer">
                <span class="text-9xl sm:text-[160px] leading-none transition-transform duration-300 group-hover:scale-110 drop-shadow-2xl">
                    🐐
                </span>
                <span class="mt-6 px-8 py-3 bg-emerald-500 text-slate-950 font-bold text-xl sm:text-2xl rounded-full shadow-lg group-hover:bg-emerald-400 transition-colors duration-300">
                    ছাগল (Goat)
                </span>
            </button>

        </div>
    </main>

    <footer class="w-full text-center py-4 text-sm text-slate-400 border-t border-slate-900">
        ফুলস্ক্রিন মোড বন্ধ করতে ছবির যেকোনো স্থানে চাপ দিন
    </footer>

    <div id="fullScreenModal" 
         onclick="closeUltraFullscreen()"
         class="fixed inset-0 z-50 bg-black hidden w-screen h-screen overflow-hidden">
        
        <!-- Floating Close Button -->
        <button onclick="closeUltraFullscreen()" 
                title="বন্ধ করুন"
                class="absolute top-4 right-4 z-20 flex items-center justify-center w-14 h-14 bg-black/70 hover:bg-red-600 text-white rounded-full transition-colors duration-200 border-2 border-white/20 shadow-2xl cursor-pointer">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>

        <!-- Image Caption Badge -->
        <div class="absolute top-4 left-4 z-20 bg-black/70 backdrop-blur-md px-6 py-2.5 rounded-full border border-white/20 text-white font-bold text-lg sm:text-xl shadow-lg">
            <span id="modalCaption"></span>
        </div>

        <!-- 100% Height & Width Display Image -->
        <img id="modalImage" 
             src="" 
             alt="Full Screen View" 
             class="w-full h-full object-cover sm:object-contain animate-zoom">

        <!-- Bottom Overlay Hint -->
        <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-20 bg-black/70 text-slate-200 px-6 py-2 rounded-full text-sm backdrop-blur-md border border-white/10 pointer-events-none shadow-lg">
            বন্ধ করতে যেকোনো জায়গায় ক্লিক করুন
        </div>
    </div>

    <script>
        // Image source direct URLs with standard fallbacks
        const animalData = {
            lion: {
                title: '🦁 সিংহ (Lion)',
                primary: 'https://postimg.cc/LJ44ykMs/image.jpg',
                fallback: 'https://images.unsplash.com/photo-1614027164847-1b28cfe1df60?auto=format&fit=crop&w=1920&q=80'
            },
            goat: {
                title: '🐐 ছাগল (Goat)',
                primary: 'https://postimg.cc/w3BVdZch'/image.jpg',
                fallback: 'https://images.unsplash.com/photo-1524024973431-2ad916746881?auto=format&fit=crop&w=1920&q=80'
            }
        };

        /**
         * Open full screen lightbox occupying 100% of display screen
         */
        function openUltraFullscreen(type) {
            const modal = document.getElementById('fullScreenModal');
            const modalImg = document.getElementById('modalImage');
            const modalCaption = document.getElementById('modalCaption');

            const item = animalData[type];
            if (!item) return;

            modalCaption.innerText = item.title;
            
            // Handle image load error automatically with fallback image
            modalImg.onerror = function() {
                this.onerror = null;
                this.src = item.fallback;
            };
            
            modalImg.src = item.primary;

            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden'; // Block background scroll
        }

        /**
         * Close full screen overlay
         */
        function closeUltraFullscreen() {
            const modal = document.getElementById('fullScreenModal');
            const modalImg = document.getElementById('modalImage');

            modal.classList.add('hidden');
            modalImg.src = '';
            document.body.style.overflow = 'auto'; // Re-enable scrolling
        }

        // Close on ESC key press
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeUltraFullscreen();
            }
        });
    </script>
</body>
</html>
